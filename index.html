<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="IngéFuté : trouve ton école d'ingénieur parmi 205 écoles en France, avec filtres, fiches et carte.">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>IngéFuté</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout : barre d'en-tête avec logo et recherche, colonne de filtres collante à gauche, résultats en cartes à droite, fiche école en panneau latéral. */
:root{
  --navy:#0E2A4B; --blue:#1663B0; --teal:#178F7C; --orange:#E8890F; --purple:#5A3EA0;
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#EAF0F7; --line:#D8E0EB; --ink:#0E2A4B; --muted:#56677F;
  --chip-on:#0E2A4B; --chip-on-ink:#FFFFFF; --header:#FFFFFF; --logo-tile:transparent; --shadow:0 1px 2px rgba(14,42,75,.06),0 6px 18px rgba(14,42,75,.07);
  --blue-soft:#E3EEF9; --teal-soft:#DFF3EF; --orange-soft:#FDEFDB; --purple-soft:#ECE7F7;
  --ok:#17795F; --ok-soft:#DDF2EA;
  --sea:#E3EBF4; --land:#FFFFFF; --dep-line:#D5DEEA; --reg-line:#93A6BF;
  --f-display:"Lexend",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --aside:300px; --head:0px; --tile-filter:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#0E2A4B; --blue:#5B9DE0; --teal:#3BBBA5; --orange:#F5A73E; --purple:#9A84DD;
  --bg:#0A1626; --surface:#102236; --surface-2:#16304A; --line:#22395A; --ink:#E5ECF5; --muted:#97A8BF;
  --chip-on:#F5A73E; --chip-on-ink:#0A1626; --header:#0D1D31; --logo-tile:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  --blue-soft:#17304D; --teal-soft:#123A38; --orange-soft:#3A2A12; --purple-soft:#271F42;
  --ok:#4CC9A0; --ok-soft:#123A30; --sea:#07111E; --land:#132A42; --dep-line:#1D3654; --reg-line:#45618A; --tile-filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.85) saturate(.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#0E2A4B; --blue:#5B9DE0; --teal:#3BBBA5; --orange:#F5A73E; --purple:#9A84DD;
  --bg:#0A1626; --surface:#102236; --surface-2:#16304A; --line:#22395A; --ink:#E5ECF5; --muted:#97A8BF;
  --chip-on:#F5A73E; --chip-on-ink:#0A1626; --header:#0D1D31; --logo-tile:#FFFFFF; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.25);
  --blue-soft:#17304D; --teal-soft:#123A38; --orange-soft:#3A2A12; --purple-soft:#271F42;
  --ok:#4CC9A0; --ok-soft:#123A30; --sea:#07111E; --land:#132A42; --dep-line:#1D3654; --reg-line:#45618A; --tile-filter:invert(1) hue-rotate(180deg) brightness(.95) contrast(.85) saturate(.6); color-scheme:dark}

:root{--r-s:2px;--r-m:4px}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.fam-blue{--c:var(--blue);--cs:var(--blue-soft)} .fam-teal{--c:var(--teal);--cs:var(--teal-soft)}
.fam-orange{--c:var(--orange);--cs:var(--orange-soft)} .fam-purple{--c:var(--purple);--cs:var(--purple-soft)}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--header);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.top-in{display:flex;align-items:center;gap:20px;min-height:var(--head);padding-block:8px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;flex:none}
.brand img{height:44px;width:auto;background:var(--logo-tile);border-radius:var(--r-s);padding:2px}
.brand-txt{font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.2}
.top{display:none}
.aside-brand{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 0 14px;text-decoration:none;color:inherit;border-bottom:1px solid var(--line)}
.aside-brand img{width:150px;height:auto;background:var(--logo-tile);border-radius:var(--r-m);padding:4px}
.aside-brand span{font-family:var(--f-display);font-weight:600;font-size:17px;text-align:center;text-wrap:balance}

/* Mise en page */
.wrap{display:grid;grid-template-columns:var(--aside) minmax(0,1fr);gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;max-width:1500px;margin:0 auto}

/* Colonne de filtres */
aside{position:sticky;top:calc(var(--head) + 16px);align-self:start;max-height:calc(100vh - var(--head) - 32px);max-height:calc(100dvh - var(--head) - 32px);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:6px 18px 18px;scrollbar-width:thin}
.aside-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-6px;background:var(--surface);padding:14px 0 10px;z-index:2;border-bottom:1px solid var(--line)}
.aside-head h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0}
.link{background:none;border:0;padding:4px 2px;color:var(--blue);font-weight:600;cursor:pointer;font-size:14px}
.link:hover{text-decoration:underline}
.fgroup{border-bottom:1px solid var(--line);padding:14px 0}
.fgroup:last-child{border-bottom:0}
.fsec{margin:0;padding:18px 0 4px;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--ink);border-bottom:1px solid var(--line)}
.fsec + .fgroup > summary{text-transform:none;letter-spacing:0;font-size:14px}
.fsec ~ .fgroup > summary{text-transform:none;letter-spacing:.01em;font-size:14px;color:var(--ink);font-weight:600}
.fgroup > summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.fgroup > summary::-webkit-details-marker{display:none}
.fgroup > summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-3px);transition:transform .15s}
.fgroup:not([open]) > summary::after{transform:rotate(-45deg)}
.fgroup .badge{background:var(--orange);color:#fff;border-radius:var(--r-s);padding:0 6px;font-size:11px;letter-spacing:0;margin-left:6px}
.fbody{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.fsub{width:100%;font-size:13px;color:var(--muted);margin:6px 0 0;display:flex;align-items:center;gap:6px}
.fsub svg{width:16px;height:16px;color:var(--c)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-s);
  padding:4px 11px;font-size:14px;cursor:pointer;line-height:1.3;transition:background .12s,border-color .12s}
.chip:hover{border-color:var(--muted)}
.chip .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}
.chip.zero{opacity:.45}
.fgroup[data-key="dom"] .fbody{flex-direction:column;align-items:flex-start}
.chip.dom{white-space:nowrap;max-width:100%}
.chip.dom[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;width:100%;border:1.5px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.seg .chip{border:0;border-radius:0;justify-content:center;flex-direction:column;gap:0;padding:8px 6px}
.seg .chip + .chip{border-left:1.5px solid var(--line)}
.seg .chip b{font-family:var(--f-display);font-weight:600;font-size:14px}
.seg .chip small{font-size:12px;color:var(--muted)}
.seg .chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.checks{display:flex;flex-direction:column;gap:2px;width:100%}
.check{display:flex;align-items:center;gap:9px;padding:4px 6px;border-radius:var(--r-s);cursor:pointer;font-size:14.5px}
.check:hover{background:var(--surface-2)}
.check input{accent-color:var(--blue);width:16px;height:16px;margin:0}
.check span:not(.n){flex:1;min-width:0}
.check .n{flex:none}
.check .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.check.zero{opacity:.45}

/* Résultats */
main{min-width:0}
.rhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:12px}
.count{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0}
.count span{color:var(--muted);font-weight:400;font-size:16px}
.tools{margin-left:auto;display:flex;gap:10px;align-items:center}
.tools select{height:38px;border-radius:var(--r-m);border:1.5px solid var(--line);background:var(--surface);padding:0 10px}
.view{display:flex;border:1.5px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.view button{background:var(--surface);border:0;padding:0 12px;height:35px;cursor:pointer;color:var(--muted);display:flex;align-items:center}
.view button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink)}
.view svg{width:18px;height:18px}
.btn-filters{display:none;height:38px;border-radius:var(--r-m);border:0;background:var(--navy);color:#fff;padding:0 14px;font-weight:600;cursor:pointer;gap:8px;align-items:center}
.active{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;min-height:0}
.active:empty{display:none}
.pill-x{display:inline-flex;align-items:center;gap:6px;background:var(--orange-soft);color:var(--ink);border:0;border-radius:var(--r-s);padding:4px 8px 4px 12px;font-size:13.5px;cursor:pointer}
.pill-x::after{content:"×";font-size:16px;line-height:1;color:var(--orange)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;
  text-align:left;width:100%;transition:transform .12s,box-shadow .12s,border-color .12s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--blue) 40%,var(--line))}
.card-top{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;border-radius:var(--r-s);padding:2px 8px;letter-spacing:.01em}
.tag.pub{background:var(--blue-soft);color:var(--blue)}
.tag.priv{background:var(--purple-soft);color:var(--purple)}
.tag.r5{background:var(--teal-soft);color:var(--teal)}
.tag.r3{background:var(--orange-soft);color:color-mix(in srgb,var(--orange) 75%,var(--ink))}
.card h3{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.25;margin:0;text-wrap:balance}
.where{color:var(--muted);font-size:14px;display:flex;gap:6px;align-items:baseline}
.where b{color:var(--ink);font-weight:600}
.fams{display:flex;gap:6px;flex-wrap:wrap}
.fam{display:inline-flex;align-items:center;gap:4px;background:var(--cs);color:var(--c);border-radius:var(--r-s);padding:3px 7px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.fam svg{width:15px;height:15px}
.fam.off{opacity:.3}
.card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.app{display:inline-flex;align-items:center;gap:5px;font-weight:600}
.app.on{color:var(--ok)} .app.only{color:var(--orange)}
.app::before{content:"";width:8px;height:8px;border-radius:0;background:currentColor}
.app.none::before{background:transparent;border:1.5px solid currentColor}

.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
td .fams{flex-wrap:nowrap;gap:4px}
td .fam{padding:2px 5px;font-size:12.5px}
td .fam svg{width:13px;height:13px}
table{font-size:13.5px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--surface-2)}
td.name{font-weight:600;white-space:normal;min-width:170px;line-height:1.25}
td.tw{white-space:normal;line-height:1.25;min-width:110px}
td.prep{max-width:none;min-width:190px}
td.tw{max-width:170px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-m);padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--f-display);color:var(--ink);font-size:18px;margin-bottom:6px}
.foot{color:var(--muted);font-size:13px;margin-top:28px}

/* Fiche école */
.sheet-bg{position:fixed;inset:0;background:rgba(6,18,34,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:51;transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.18)}
.sheet.open{transform:none}
.sheet-head{flex:none;background:var(--navy);color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 22px 24px;position:relative;overflow:hidden}
.sheet-head::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:0;transform:rotate(45deg);
  background:conic-gradient(from 200deg,#1B9A86 0 25%,#1663B0 0 50%,#5A3EA0 0 75%,#F0961B 0);opacity:.22}
.sheet-nav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:14px;position:relative;z-index:1}
.sheet-nav .grp{display:flex;gap:6px}
.icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:var(--r-m);height:36px;min-width:36px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.icon-btn:hover{background:rgba(255,255,255,.22)}
.icon-btn svg{width:18px;height:18px}
.sheet-head h2{font-family:var(--f-display);font-size:28px;font-weight:600;margin:0 0 6px;line-height:1.15;text-wrap:balance;position:relative;z-index:1}
.sheet-head p{margin:0;opacity:.85;position:relative;z-index:1}
.sheet-body{overflow:auto;padding:20px max(24px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 24px;display:flex;flex-direction:column;gap:16px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px}
.fact small{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.fact b{font-family:var(--f-display);font-weight:600;font-size:15.5px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px}
.block h3{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0 0 12px}
.row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.row:first-of-type{border-top:0;padding-top:0}
.row > span{font-size:13.5px;color:var(--muted);font-weight:600;padding-top:3px}
.ticks{display:flex;flex-wrap:wrap;gap:5px}
.tick{font-size:13px;border-radius:var(--r-s);padding:3px 8px;background:var(--surface-2);color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.tick.on{background:var(--ok-soft);color:var(--ok);font-weight:700;text-decoration:none}
.na{color:var(--muted);font-style:italic;font-size:14px}
.domfam{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.domcol{border-radius:var(--r-m);background:var(--cs);padding:12px 14px}
.domcol h4{margin:0 0 8px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--c);font-family:var(--f-display);font-weight:600}
.domcol h4 svg{width:20px;height:20px}
.domcol ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.domcol li{font-size:14px;display:flex;gap:7px;align-items:baseline}
.domcol li::before{content:"";flex:none;width:6px;height:6px;border-radius:0;background:var(--c);transform:translateY(-2px)}
.domcol li.off{color:var(--muted);opacity:.55}
.domcol li.off::before{background:transparent;border:1.5px solid var(--c)}
.note{border-left:3px solid var(--orange);padding:4px 0 4px 12px;color:var(--ink);font-size:14px}
.src{font-size:12.5px;color:var(--muted)}

.mapview{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.mapbox{position:relative;background:var(--sea);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;height:min(72vh,700px);touch-action:none;user-select:none}
#map{width:100%;height:100%;display:block;cursor:grab}
#map.drag{cursor:grabbing}
.land{fill:var(--land);stroke:var(--dep-line);stroke-width:.6;vector-effect:non-scaling-stroke}
.reg{fill:none;stroke:var(--reg-line);stroke-width:1.1;vector-effect:non-scaling-stroke;pointer-events:none}
.pt{cursor:pointer}
.pt circle{fill:var(--blue);fill-opacity:.88;stroke:var(--land);stroke-width:1.5;vector-effect:non-scaling-stroke}
.pt:hover circle{fill-opacity:1}
.pt.sel circle{fill:var(--orange);fill-opacity:1}
.pt text{fill:#fff;font-family:var(--f-body);font-weight:700;pointer-events:none}
.pt .lbl{fill:var(--ink);font-family:var(--f-body);font-weight:600;paint-order:stroke;stroke:var(--land);stroke-linejoin:round;pointer-events:none}
.zoom{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.zoom button{width:36px;height:34px;border:0;background:var(--surface);font-size:18px;font-weight:600;cursor:pointer;color:var(--ink)}
.zoom button + button{border-top:1px solid var(--line)}
.zoom button:hover{background:var(--surface-2)}
.insets{position:absolute;left:10px;bottom:10px;display:flex;gap:8px}
.inset{background:var(--sea);border:1px solid var(--line);border-radius:var(--r-m);padding:4px 6px 3px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow)}
.inset span{font-size:11px;color:var(--muted);font-weight:600}
.maplegend{position:absolute;right:10px;bottom:8px;margin:0;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:3px 8px;border-radius:var(--r-s)}
.mappanel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 14px 16px;max-height:min(72vh,700px);overflow:auto}
.mappanel h3{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0 0 2px}
.mappanel .sub{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.mappanel .hint{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.prow,.crow{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 4px;cursor:pointer;border-radius:var(--r-s)}
.prow:hover,.crow:hover{background:var(--surface-2)}
.prow b{font-family:var(--f-display);font-weight:600;font-size:14.5px;line-height:1.25}
.prow .card-top{gap:4px}
.prow .addr-s{font-size:13px;color:var(--muted);line-height:1.3}

/* Carte : occupe toute la colonne de droite */
.mapwrap{position:relative;height:calc(100vh - var(--head) - 150px);height:calc(100dvh - var(--head) - 150px);min-height:440px;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--sea)}
#lmap{position:absolute;inset:0}
.leaflet-container{font-family:var(--f-body);font-size:14px;background:var(--sea)}
.base-plan{filter:var(--tile-filter)}
.mk{border-radius:50%;background:var(--blue);border:2px solid var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk.sel{background:var(--orange);z-index:1000!important}
.mk-cl{display:flex!important;align-items:center;justify-content:center;border-radius:50%;background:color-mix(in srgb,var(--blue) 90%,transparent);color:#fff;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;border:2px solid var(--surface);box-shadow:0 1px 5px rgba(0,0,0,.35)}
.mk-cl.sel{background:var(--orange)}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--ink);border-radius:var(--r-m);box-shadow:var(--shadow);border:1px solid var(--line)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:12px 14px}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.pop{display:flex;flex-direction:column;gap:7px}
.pop b{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.25;padding-right:14px}
.pop .addr-s{font-size:13px;color:var(--muted);line-height:1.4}
.pop-btn{align-self:flex-start;border:0;border-radius:var(--r-s);background:var(--navy);color:#fff;font-weight:600;font-size:13.5px;padding:6px 12px;cursor:pointer}
.pop-btn:hover{filter:brightness(1.2)}
.leaflet-bar{border:1px solid var(--line)!important;border-radius:var(--r-m)!important;box-shadow:var(--shadow)!important;overflow:hidden}
.leaflet-bar a,.leaflet-bar a:hover{background:var(--surface);color:var(--ink);border-bottom-color:var(--line);border-radius:0!important}
.leaflet-bar a:hover{background:var(--surface-2)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 88%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--blue)}
.mapctl{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;box-shadow:var(--shadow)}
.mapctl button{border:0;background:var(--surface);color:var(--ink);padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer}
.mapctl button+button{border-left:1px solid var(--line)}
.mapctl button:hover,.mapctl button[aria-pressed="true"]{background:var(--surface-2)}
/* Filtre ville */
.city{position:relative;width:100%}
.city input{width:100%;height:38px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--bg);padding:0 10px;font-size:14.5px}
.city input:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 3px);z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow);margin:0;padding:4px 0;list-style:none;max-height:264px;overflow:auto}
.sugg li{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 10px;cursor:pointer;font-size:14.5px}
.sugg li[aria-selected="true"],.sugg li[data-i]:hover{background:var(--surface-2)}
.sugg li.zero{opacity:.5}
.sugg li .n{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.sugg mark{background:none;color:var(--blue);font-weight:700}
.sugg li.none{color:var(--muted);cursor:default}
.citysel{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.citysel:empty{display:none}
.city-chip .x{font-size:16px;line-height:1;margin-left:2px}
.fhint{width:100%;margin:0;font-size:12.5px;color:var(--muted)}
@media (max-width:960px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .mapview{grid-template-columns:minmax(0,1fr)}
  .mapbox{height:62vh}
  .mapwrap{height:70vh;height:70dvh;min-height:380px}

const fold = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
DATA.forEach(e=>{ e._q = fold([e.n,e.com,e.dpt,e.reg,e.coma,e.cp].join(' ')); e._acc = e.bac.length+(e.b1?1:0)+e.prep.length+(e.bts?1:0)+(e.but?1:0)+(e.ats?1:0)+e.lm.length; });

const REGIONS = [...new Set(DATA.map(e=>e.reg))].sort((a,b)=>fold(a).localeCompare(fold(b)));
const norm = s => fold(s).replace(/[-'’]/g,' ').replace(/\bst(e?) /g,'saint$1 ').replace(/\s+/g,' ').trim();
const CITIES = (()=>{ const m=new Map(); for(const e of DATA){ let c=m.get(e.ck); if(!c){ c={ck:e.ck,com:e.com,dpt:e.dpt,label:`${e.com} (${e.dpt})`,key:norm(e.com),al:new Set()}; m.set(e.ck,c);} if(norm(e.coma)!==c.key) c.al.add(e.coma); }
  return [...m.values()].map(c=>({...c,alias:[...c.al].map(norm),aliasTxt:[...c.al].join(', ')})).sort((a,b)=>a.key.localeCompare(b.key)); })();
const GROUPS = [
  {key:'r', label:'Recrutement', kind:'seg', open:false, opts:[[5,'Post-bac','cursus 5 ans'],[3,'Bac+2','cycle 3 ans']], test:(e,v)=>e.r===v},

  {key:'reg', label:'Région', kind:'checks', open:false, opts:REGIONS.map(r=>[r,r]), test:(e,v)=>e.reg===v},
  {key:'ville', label:'Ville', kind:'city', open:false, opts:CITIES.map(c=>[c.ck,c.label]), test:(e,v)=>e.ck===v},
  {key:'dom', label:'Domaines', kind:'doms', open:false, opts:DOMS.map((d,i)=>[i,d]), test:(e,v)=>e.dom.includes(v)},
  {key:'app', label:'Apprentissage', kind:'chips', open:false, opts:[['1','Possible'],['2','Uniquement'],['0','Sans']], test:(e,v)=> v==='1'?e.app>=1 : e.app===+v},
  {key:'bac', label:'… un bac', sec:'Y rentrer après…', kind:'chips', open:false, opts:[['G','Bac général'],['STI2D','STI2D'],['STL','STL'],['STAV','STAV'],['b1','Bac+1'],['rd','Rentrée décalée']],
     test:(e,v)=> v==='b1'?e.b1 : v==='rd'?e.rd : e.bac.includes(v)},
  {key:'prep', label:'… une prépa', kind:'chips', open:false, opts:PREPS.map(p=>[p,p]), test:(e,v)=>e.prep.includes(v)},
  {key:'voie', label:'… un BTS, BUT', kind:'chips', open:false, opts:[['bts','BTS / BTSA'],['but','BUT'],['ats','ATS']], test:(e,v)=>!!e[v]},
  {key:'lm', label:'… une licence / un master', kind:'chips', open:false, opts:LMS.map(l=>[l,l]), test:(e,v)=>e.lm.includes(v)},
];
const DOM_LABEL = {'Environnement - développement durable - aménagement du territoire':'Environnement · dév. durable','Sciences de la terre - sciences de l\'Univers':'Sc. de la Terre / de l\'Univers','Informatique - télécommunications':'Informatique · télécoms'};
const DOM_SHORT = d => DOM_LABEL[d] || d.replace(' - ',' · ').split(' - ')[0];

const state = { q:'', sel:{}, sort:'az', view:'map' };
GROUPS.forEach(g=>state.sel[g.key]=new Set());

function passes(e, except){
  if(state.q && !state.q.split(/\s+/).every(t=>e._q.includes(t))) return false;
  for(const g of GROUPS){ if(g.key===except) continue; const s=state.sel[g.key]; if(!s.size) continue;
    let ok=false; for(const v of s){ if(g.test(e,v)){ok=true;break;} } if(!ok) return false; }
  return true;
}

// ---------- Filtres ----------
const fg = document.getElementById('fgroups');
function buildFilters(){
  fg.innerHTML = GROUPS.map(g=>{
    let body='';
    if(g.kind==='seg') body = `<div class="seg">${g.opts.map(([v,a,b])=>`<button type="button" class="chip" data-g="${g.key}" data-v="${v}" aria-pressed="false"><b>${a}</b><small>${b} · <span class="n"></span></small></button>`).join('')}</div>`;
    else if(g.kind==='checks') body = `<div class="checks">${g.opts.map(([v,l])=>`<label class="check" data-g="${g.key}" data-v="${esc(v)}"><input type="checkbox" id="c-${g.key}-${fold(v).replace(/[^a-z0-9]+/g,'-')}"><span>${esc(l)}</span><span class="n"></span></label>`).join('')}</div>`;
    else if(g.kind==='city') body = `<div class="city"><input id="cityIn" type="text" role="combobox" aria-autocomplete="both" aria-expanded="false" aria-controls="citySugg" aria-label="Ville" placeholder="Tape le nom d'une ville…" autocomplete="off" spellcheck="false"><ul class="sugg" id="citySugg" role="listbox" aria-label="Villes" hidden></ul></div><div class="citysel" id="citySel"></div>`;
    else if(g.kind==='doms') body = FAMS.map(f=>`<p class="fsub fam-${f.k}">${ICON[f.icon]}${f.label}</p>`+f.doms.map(i=>`<button type="button" class="chip dom fam-${f.k}" data-g="dom" data-v="${i}" aria-pressed="false" title="${esc(DOMS[i])}">${esc(DOM_SHORT(DOMS[i]))} <span class="n"></span></button>`).join('')).join('');
    else body = g.opts.map(([v,l])=>`<button type="button" class="chip" data-g="${g.key}" data-v="${v}" aria-pressed="false">${esc(l)} <span class="n"></span></button>`).join('');
    return (g.sec?`<p class="fsec">${g.sec}</p>`:'')+`<details class="fgroup" ${g.open?'open':''} data-key="${g.key}"><summary>${g.label}<span class="badge" hidden></span></summary><div class="fbody">${body}</div></details>`;
  }).join('');
}
const parseV = (g,v) => (g==='r'||g==='dom') ? +v : v;
fg.addEventListener('click', ev=>{
  const b = ev.target.closest('button.chip'); if(!b) return;
  toggle(b.dataset.g, parseV(b.dataset.g,b.dataset.v));
});
fg.addEventListener('change', ev=>{
  const l = ev.target.closest('label.check'); if(!l) return;
  toggle(l.dataset.g, l.dataset.v);
});
function toggle(g,v){ const s=state.sel[g]; s.has(v)?s.delete(v):s.add(v); render(); }

function updateFilterUI(){
  for(const g of GROUPS){
    const base = DATA.filter(e=>passes(e,g.key));
    fg.querySelectorAll(`[data-g="${g.key}"]`).forEach(el=>{
      const v = parseV(g.key, el.dataset.v);
      const n = base.filter(e=>g.test(e,v)).length;
      const on = state.sel[g.key].has(v);
      el.querySelector('.n').textContent = n;
      el.classList.toggle('zero', n===0 && !on);
      if(el.tagName==='BUTTON') el.setAttribute('aria-pressed', on);
      else el.querySelector('input').checked = on;
    });
    const badge = fg.querySelector(`details[data-key="${g.key}"] .badge`);
    const k = state.sel[g.key].size; badge.hidden = !k; badge.textContent = k;
  }
}

// ---------- Résultats ----------
const res = document.getElementById('results');
let current = [];
function famCounts(e){ return FAMS.map(f=>({f, n:e.dom.filter(d=>f.doms.includes(d)).length})); }
const famHTML = e => `<div class="fams">${famCounts(e).map(({f,n})=>`<span class="fam fam-${f.k} ${n?'':'off'}" title="${f.label} : ${n}">${ICON[f.icon]}${n}</span>`).join('')}</div>`;
const appHTML = e => e.app===2?'<span class="app only">Apprentissage uniquement</span>':e.app===1?'<span class="app on">Apprentissage possible</span>':'<span class="app none">Sans apprentissage</span>';
const rTag = e => e.r===5?'<span class="tag r5">Post-bac · 5 ans</span>':'<span class="tag r3">Bac+2 · 3 ans</span>';
const sTag = e => e.s==='Public'?'<span class="tag pub">Public</span>':'<span class="tag priv">Privé</span>';

function sorted(list){
  const by = {
    az:(a,b)=>fold(a.n).localeCompare(fold(b.n)),
    dom:(a,b)=>b.dom.length-a.dom.length||fold(a.n).localeCompare(fold(b.n)),
    reg:(a,b)=>fold(a.reg).localeCompare(fold(b.reg))||fold(a.com).localeCompare(fold(b.com))||fold(a.n).localeCompare(fold(b.n)),
    acc:(a,b)=>b._acc-a._acc||fold(a.n).localeCompare(fold(b.n)),
  }[state.sort];
  return list.slice().sort(by);
}

function render(){
  current = sorted(DATA.filter(e=>passes(e)));
  renderCitySel();
  updateFilterUI();
  const n = current.length;
  document.getElementById('count').innerHTML = `${n} école${n>1?'s':''} <span>sur ${DATA.length}</span>`;
  document.getElementById('closeFilters').textContent = n ? `Voir ${n>1?'les '+n+' écoles':'l\'école'}` : 'Aucune école, modifie les filtres';
  const nActive = Object.values(state.sel).reduce((a,s)=>a+s.size,0) + (state.q?1:0);
  document.getElementById('nf').textContent = nActive?`(${nActive})`:'';
  // pastilles actives
  const act=[];
  if(state.q) act.push(`<button class="pill-x" data-x="q">« ${esc(state.q)} »</button>`);
  for(const g of GROUPS) for(const v of state.sel[g.key]){
    const o = g.opts.find(o=>o[0]===v); let l = g.key==='dom'?DOM_SHORT(DOMS[v]):(g.kind==='seg'?o[1]+' ('+o[2]+')':o[1]);
    if(g.key==='app') l='Apprentissage : '+l.toLowerCase();
    act.push(`<button class="pill-x" data-x="${g.key}" data-v="${esc(v)}">${esc(l)}</button>`);
  }
  document.getElementById('active').innerHTML = act.join('');
  const isMap = state.view==='map';
  mapwrap.hidden = !isMap || !n; res.hidden = isMap && n>0;
  if(!n){ res.innerHTML = `<div class="empty"><strong>Aucune école ne correspond</strong>Retire un filtre ou élargis la recherche.</div>`; return; }
  if(isMap){ renderMap(); return; }
  if(state.view==='cards'){
    res.innerHTML = `<div class="grid">${current.map(e=>`
      <button class="card" type="button" data-id="${e.id}">
        <div class="card-top">${sTag(e)}${rTag(e)}</div>
        <h3>${esc(e.n)}</h3>
        <div class="where"><b>${esc(e.com)}</b> (${esc(e.dpt)}) · ${esc(e.reg)}</div>
        ${famHTML(e)}
        <div class="card-foot">${appHTML(e)}<span>${e.dom.length} domaine${e.dom.length>1?'s':''}</span></div>
      </button>`).join('')}</div>`;
  } else {
    res.innerHTML = `<div class="table-wrap"><table><thead><tr><th>École</th><th>Statut</th><th>Entrée</th><th>Commune</th><th>Prépas</th><th>Apprent.</th><th>Domaines</th></tr></thead><tbody>${current.map(e=>`
      <tr data-id="${e.id}" tabindex="0"><td class="name">${esc(e.n)}</td><td>${e.s}</td><td>${e.r===5?'Post-bac':'Bac+2'}</td><td class="tw">${esc(e.com)} (${esc(e.dpt)})</td><td class="tw prep">${e.prep.join(', ')||'—'}</td><td>${['Non','Possible','Uniquement'][e.app]}</td><td>${famHTML(e)}</td></tr>`).join('')}</tbody></table></div>`;
  }
}
res.addEventListener('click', ev=>{
  const c=ev.target.closest('[data-id]'); if(c) openSchool(c.dataset.id); });
res.addEventListener('keydown', ev=>{ if(ev.key==='Enter'){ const c=ev.target.closest('tr[data-id]'); if(c) openSchool(c.dataset.id);} });
document.getElementById('active').addEventListener('click', ev=>{
  const b=ev.target.closest('.pill-x'); if(!b) return;
  if(b.dataset.x==='q'){ state.q=''; }
  else { const g=b.dataset.x; const v=parseV(g,b.dataset.v); state.sel[g].delete(v); }
  render();
});
document.getElementById('sort').addEventListener('change', ev=>{ state.sort=ev.target.value; render(); });

// les tuiles sont regroupées par niveau de zoom dans quelques fichiers chargés à la demande
function loadBundle(g){ if(!bundles.has(g)) bundles.set(g,fetch(`b/tiles-${g}.json`).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })); return bundles.get(g); }
function loadImg(src){ if(!imgCache.has(src)) imgCache.set(src,new Promise((ok,ko)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=ko; i.src=src; })); return imgCache.get(src); }
function initMap(){
  // Fond embarqué : tuiles Plan IGN publiées avec la page. Quand une tuile manque, on agrandit la tuile du niveau au-dessus.
  const EmbeddedIGN = L.GridLayer.extend({ createTile(c, done){
    const cv=document.createElement('canvas'); cv.width=cv.height=256;
    let z=c.z, x=c.x, y=c.y, d=0;
    while(z>=4 && !TSET.has(`${z}_${x}_${y}`)){ z--; x>>=1; y>>=1; d++; }
    if(z<4){ setTimeout(()=>done(null,cv)); return cv; }
    const key=`${z}_${x}_${y}`;
    loadBundle(z<=6?'low':String(z)).then(b=>loadImg('data:image/webp;base64,'+b[key])).then(img=>{ const k=1<<d, s=256/k, g=cv.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(img,(c.x%k)*s,(c.y%k)*s,s,s,0,0,256,256); done(null,cv); }).catch(()=>done(null,cv));
    return cv; } });
  lmap=L.map('lmap',{zoomControl:false,minZoom:4,maxZoom:12,zoomSnap:0.5,wheelPxPerZoomLevel:90});
  L.control.zoom({position:'topright',zoomInTitle:'Zoomer',zoomOutTitle:'Dézoomer'}).addTo(lmap);
  lmap.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');
  embedded=new EmbeddedIGN({className:'base-plan',attribution:ATTR,minZoom:4,maxZoom:12}).addTo(lmap);
  if(window.ResizeObserver) new ResizeObserver(()=>lmap.invalidateSize()).observe(mapwrap);
  lmap.fitBounds(FR);
  cluster=L.markerClusterGroup({maxClusterRadius:44,showCoverageOnHover:false,spiderfyOnMaxZoom:true,
    iconCreateFunction:cl=>{ const n=cl.getChildCount(), s=Math.round(26+Math.min(24,Math.sqrt(n)*4)), on=cl.getAllChildMarkers().some(m=>m.options.sid===selId);
      return L.divIcon({html:`<span>${n}</span>`,className:'mk-cl'+(on?' sel':''),iconSize:[s,s]}); }});
  lmap.addLayer(cluster);
  const Places=L.Control.extend({options:{position:'bottomleft'},onAdd(){
    const d=L.DomUtil.create('div','mapctl'); d.innerHTML='<button type="button" data-p="fr">Métropole</button><button type="button" data-p="971">Guadeloupe</button><button type="button" data-p="974">La Réunion</button>';
    L.DomEvent.disableClickPropagation(d);
    d.onclick=ev=>{ const p=ev.target.closest('[data-p]')?.dataset.p; if(p==='fr') lmap.fitBounds(FR); if(p==='971') lmap.setView([16.24,-61.54],10); if(p==='974') lmap.setView([-21.13,55.5],10); };
    return d; }});
  new Places().addTo(lmap);
  lmap.on('popupopen',ev=>{ const b=ev.popup.getElement().querySelector('[data-open]'); if(b) b.onclick=()=>openSchool(b.dataset.open); });
  probeOnline();
}
// Plan IGN en ligne (toutes les échelles) quand le navigateur peut joindre la Géoplateforme de l'IGN
function probeOnline(){
  const i=new Image(); let late=false; setTimeout(()=>{late=true;},5000);
  i.onload=()=>{ if(!late) goOnline(); };
  i.src=IGN('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2').replace('{z}','6').replace('{y}','22').replace('{x}','32');
}
function goOnline(){
  const plan=L.tileLayer(IGN('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2'),{maxZoom:18,className:'base-plan',attribution:ATTR});
  const photo=L.tileLayer(IGN('ORTHOIMAGERY.ORTHOPHOTOS'),{maxZoom:18,attribution:'Photographies aériennes © IGN'});
  lmap.removeLayer(embedded); plan.addTo(lmap); lmap.setMaxZoom(18);
  const Base=L.Control.extend({options:{position:'topleft'},onAdd(){
    const d=L.DomUtil.create('div','mapctl'); d.innerHTML='<button type="button" data-b="plan" aria-pressed="true">Plan</button><button type="button" data-b="photo" aria-pressed="false">Photos</button>';
    L.DomEvent.disableClickPropagation(d);
    d.onclick=ev=>{ const b=ev.target.closest('[data-b]')?.dataset.b; if(!b) return; const [on,off]=b==='plan'?[plan,photo]:[photo,plan]; lmap.removeLayer(off); on.addTo(lmap); on.bringToBack(); d.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.b===b)); };
    return d; }});
  new Base().addTo(lmap);
}
const dotIcon = on => L.divIcon({className:'mk'+(on?' sel':''),iconSize:[16,16]});
const popupHTML = e => `<div class="pop"><b>${esc(e.n)}</b><div class="card-top">${sTag(e)}${rTag(e)}</div><div class="addr addr-s">${esc(addrLines(e.adr))}</div><button type="button" class="pop-btn" data-open="${e.id}">Voir la fiche</button></div>`;
function markerFor(e){
  let m=markers.get(e.id); if(m) return m;
  m=L.marker([e.lat,e.lon],{icon:dotIcon(false),sid:e.id,title:e.n});
  m.bindPopup(()=>popupHTML(e),{maxWidth:280,minWidth:220,autoPanPadding:[40,40]});
  m.on('popupopen',()=>setSel(e.id)); m.on('popupclose',()=>{ if(selId===e.id) setSel(null); });
  markers.set(e.id,m); return m;
}
function setSel(id){ const prev=selId; selId=id; for(const k of [prev,id]) if(k && markers.has(k)) markers.get(k).setIcon(dotIcon(k===id)); cluster.refreshClusters(); }
function renderMap(){
  if(typeof L==='undefined'){ mapwrap.innerHTML='<div class="empty"><strong>La carte ne peut pas s\'afficher</strong>La bibliothèque cartographique n\'a pas pu être chargée. Vérifie ta connexion puis recharge la page.</div>'; return; }
  if(!lmap) initMap(); else setTimeout(()=>lmap.invalidateSize(),0);
  const sig=current.map(e=>e.id).join(',');
  if(sig===lastSig) return;
  const first=lastSig===null; lastSig=sig;
  cluster.clearLayers(); cluster.addLayers(current.map(markerFor));
  const filtered=current.length<DATA.length;
  if(!filtered){ if(!first) lmap.fitBounds(FR); return; }
  const metro=current.filter(e=>!isDom(e)), pts=(metro.length?metro:current).map(e=>[e.lat,e.lon]);
  lmap.fitBounds(L.latLngBounds(pts).pad(0.2),{maxZoom:12});
}
function focusSchool(e){
  if(!current.some(x=>x.id===e.id)){ GROUPS.forEach(g=>state.sel[g.key].clear()); state.q=''; render(); }
  const m=markerFor(e); cluster.zoomToShowLayer(m,()=>m.openPopup());
}

function addrLines(a){
  const p=(a||'').split(/,\s*/), last=p.pop()||'';
  const head=[], extra=[];
  for(const x of p){ (/^(BP|CS|TSA|case|Campus|bâtiment|Bâtiment|Domaine|Cité|Parc|Technopôle|Pôle|Agrapole|Minatec|Atlanpôle|UFR|Maison)/i.test(x) && head.length ? extra : head).push(x); }
  return [head.join(', '), extra.join(', '), last].filter(Boolean).join('\n');
}
function schoolHTML(e){
  const atsTxt = e.ats ? 'ATS '+e.ats.toLowerCase() : 'ATS';
  const post = e.r===5 ? ticks(['G','STI2D','STL','STAV'], x=>e.bac.includes(x), x=>x==='G'?'Bac général':'Bac '+x)
      + `<div class="ticks" style="margin-top:5px">${[['Bac+1',e.b1],['Rentrée décalée',e.rd]].map(([l,o])=>`<span class="tick ${o?'on':''}">${l}</span>`).join('')}</div>`
      : '<span class="na">Pas de recrutement juste après le bac : l\'école recrute à bac+2.</span>';
  return `
  <div class="facts">
    <div class="fact"><small>Recrutement</small><b>${e.r===5?'Post-bac':'Bac+2'}</b></div>
    <div class="fact"><small>Durée</small><b>${e.r===5?'5 ans':'3 ans'}</b></div>
    <div class="fact"><small>Statut</small><b>${e.s}</b></div>
    <div class="fact"><small>Apprentissage</small><b>${['Non','Possible','Uniquement'][e.app]}</b></div>
  </div>
  <div class="block">
    <h3>Comment y entrer</h3>
    <div class="row"><span>Après le bac</span><div>${post}</div></div>
    <div class="row"><span>Classes prépa</span><div>${ticks(PREPS, x=>e.prep.includes(x))}</div></div>
    <div class="row"><span>BTS, BUT, ATS</span><div>${ticks(['bts','but','ats'], x=>!!e[x], x=>x==='bts'?'BTS / BTSA':x==='but'?'BUT':atsTxt)}</div></div>
    <div class="row"><span>Licence, master</span><div>${e.lm.length?ticks(LMS, x=>e.lm.includes(x)):'<span class="na">Aucune admission parallèle indiquée.</span>'}</div></div>
    ${e.app?`<div class="row"><span>Apprentissage</span><div>${e.app===2?'La formation se fait uniquement par l\'apprentissage.':'Possible pour certaines spécialités de l\'école.'}${e.appn?`<div class="src" style="margin-top:4px">${esc(e.appn)}</div>`:''}</div></div>`:''}
  </div>
  <div class="block">
    <h3>Domaines de spécialités <span class="src">(${e.dom.length} sur 23)</span></h3>
    <div class="domfam">${FAMS.map(f=>`<div class="domcol fam-${f.k}"><h4>${ICON[f.icon]}${f.label}</h4><ul>${f.doms.map(d=>`<li class="${e.dom.includes(d)?'':'off'}">${esc(DOMS[d])}</li>`).join('')}</ul></div>`).join('')}</div>
  </div>
  <div class="block">
    <h3>Où se trouve l'école</h3>
    <div class="row"><span>Adresse</span><div><div class="addr">${esc(addrLines(e.adr))}</div>${e.adrn?`<div class="urlnote">${esc(e.adrn)}</div>`:''}</div></div>
    <div class="row"><span>Code postal</span><div>${esc(e.cp)} ${esc(e.coma)}${fold(e.coma)!==fold(e.com)?` <span class="src">(le guide indique ${esc(e.com)})</span>`:''}</div></div>
    <div class="row"><span>Département</span><div>${esc(e.dpt)}</div></div>
    <div class="row"><span>Région</span><div>${esc(e.reg)}</div></div>
    <div class="row"><span>Coordonnées</span><div>${e.lat.toFixed(5)}, ${e.lon.toFixed(5)} <span class="src">(point placé ${precTxt[e.prec]||''})</span></div></div>
    <div class="row"><span>Site web</span><div><a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.url.replace(/^https?:\/\//,'').replace(/\/$/,''))}</a>${e.urln?`<div class="urlnote">${e.urlok?'':'À vérifier : '}${esc(e.urln)}</div>`:''}</div></div>
    ${e.loc?`<div class="row"><span>Précisions</span><div>${esc(e.loc)}</div></div>`:''}
  </div>
  ${e.note?`<p class="note">${esc(e.note)}</p>`:''}
  <p class="src">Données 2026 - susceptibles d'erreurs ou de modifications - Renseignez-vous plus précisément sur le site des écoles, lors des salons ou des JPO.</p>`;
}
let openId=null;
function openSchool(id){ if(location.hash!=='#'+id) location.hash=id; else show(id); }
function closeSchool(){ if(location.hash) history.pushState('', document.title, location.pathname+location.search); hide(); }
function show(id){
  const e=DATA.find(x=>x.id===id); if(!e){ hide(); return; }
  openId=id;
  document.getElementById('sTitle').textContent=e.n;
  document.getElementById('sSub').textContent=`${e.com} (${e.dpt}) · ${e.reg}`;
  const site=document.getElementById('sSite'); site.href=e.url; site.hidden=!e.url;
  const body=document.getElementById('sBody'); body.innerHTML=schoolHTML(e); body.scrollTop=0;
  const list=current.length?current:DATA, i=list.findIndex(x=>x.id===id);
  document.getElementById('sPrev').disabled = i<=0; document.getElementById('sNext').disabled = i<0||i>=list.length-1;
  sheet.classList.add('open'); sheetBg.classList.add('open'); sheet.setAttribute('aria-hidden','false');
  document.getElementById('sClose').focus({preventScroll:true});
}
function hide(){ openId=null; sheet.classList.remove('open'); sheetBg.classList.remove('open'); sheet.setAttribute('aria-hidden','true'); }
function step(d){ const list=current.length?current:DATA, i=list.findIndex(x=>x.id===openId); const t=list[i+d]; if(t) openSchool(t.id); }
document.getElementById('sPrev').onclick=()=>step(-1);
document.getElementById('sNext').onclick=()=>step(1);
document.getElementById('sClose').onclick=closeSchool;
document.getElementById('sMap').onclick=()=>{ const e=DATA.find(x=>x.id===openId); if(!e) return; closeSchool(); if(state.view!=='map') setView('map'); window.scrollTo({top:0}); setTimeout(()=>focusSchool(e),60); };
sheetBg.onclick=closeSchool;
document.addEventListener('keydown',ev=>{ if(!openId) return; if(ev.key==='Escape') closeSchool(); if(ev.key==='ArrowRight') step(1); if(ev.key==='ArrowLeft') step(-1); });
window.addEventListener('hashchange',()=>{ const id=location.hash.slice(1); id?show(id):hide(); });

buildFilters();
// ---------- Filtre ville (saisie avec suggestions) ----------
const cityIn=document.getElementById('cityIn'), sugg=document.getElementById('citySugg');
let sItems=[], sIdx=-1;
function hl(name,q){ const i=norm(name).indexOf(q); return i<0?esc(name):esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+q.length))+'</mark>'+esc(name.slice(i+q.length)); }
function closeSugg(){ sugg.hidden=true; sItems=[]; sIdx=-1; cityIn.setAttribute('aria-expanded','false'); cityIn.removeAttribute('aria-activedescendant'); }
function paintSugg(){ sugg.querySelectorAll('li[data-i]').forEach(li=>li.setAttribute('aria-selected',+li.dataset.i===sIdx)); if(sIdx>=0) cityIn.setAttribute('aria-activedescendant','sg'+sIdx); }
function suggest(typed, complete){
  const q=norm(typed); if(!q){ closeSugg(); return; }
  const cnt=new Map(); DATA.filter(e=>passes(e,'ville')).forEach(e=>cnt.set(e.ck,(cnt.get(e.ck)||0)+1));
  sItems=CITIES.filter(c=>!state.sel.ville.has(c.ck)).map(c=>{
    const rank=c.key.startsWith(q)?0:(' '+c.key).includes(' '+q)?1:c.key.includes(q)?2:c.alias.some(a=>a.startsWith(q))?3:9;
    return {c,rank,n:cnt.get(c.ck)||0}; }).filter(x=>x.rank<9)
    .sort((a,b)=>a.rank-b.rank||(b.n>0)-(a.n>0)||b.n-a.n||a.c.key.localeCompare(b.c.key)).slice(0,8);
  sIdx=sItems.length?0:-1;
  sugg.innerHTML = sItems.length ? sItems.map((x,i)=>`<li role="option" id="sg${i}" data-i="${i}" class="${x.n?'':'zero'}"><span>${hl(x.c.com,q)} <span class="src">(${x.c.dpt})</span>${x.rank===3?` <span class="src">· ${esc(x.c.aliasTxt)}</span>`:''}</span><span class="n">${x.n}</span></li>`).join('') : '<li class="none">Aucune ville ne correspond</li>';
  sugg.hidden=false; cityIn.setAttribute('aria-expanded','true'); paintSugg();
  // préremplissage : complète le nom de la première ville pendant la frappe
  if(complete && sItems[0] && sItems[0].rank===0 && typed.length<sItems[0].c.com.length){
    const full=sItems[0].c.com; cityIn.value=typed+full.slice(typed.length); cityIn.setSelectionRange(typed.length,full.length);
  }
}
function chooseCity(c){ state.sel.ville.add(c.ck); cityIn.value=''; closeSugg(); render(); cityIn.focus(); }
cityIn.addEventListener('input',ev=>{ const s=cityIn.selectionStart; const typed=cityIn.value.slice(0,s); suggest(typed, ev.inputType && ev.inputType.startsWith('insert') && s===cityIn.value.length); });
cityIn.addEventListener('keydown',ev=>{
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){ if(sugg.hidden){ suggest(cityIn.value,false); } else if(sItems.length){ sIdx=(sIdx+(ev.key==='ArrowDown'?1:-1)+sItems.length)%sItems.length; paintSugg(); } ev.preventDefault(); }
  else if(ev.key==='Enter'){ if(sIdx>=0 && sItems[sIdx]){ chooseCity(sItems[sIdx].c); ev.preventDefault(); } }
  else if(ev.key==='Escape'){ if(cityIn.selectionStart!==cityIn.selectionEnd) cityIn.value=cityIn.value.slice(0,cityIn.selectionStart); closeSugg(); }
  else if(ev.key==='Tab' && !sugg.hidden && sIdx>=0 && cityIn.value){ chooseCity(sItems[sIdx].c); }
});
sugg.addEventListener('mousedown',ev=>{ const li=ev.target.closest('li[data-i]'); if(!li) return; ev.preventDefault(); chooseCity(sItems[+li.dataset.i].c); });
cityIn.addEventListener('blur',()=>setTimeout(closeSugg,120));
function renderCitySel(){
  document.getElementById('citySel').innerHTML=[...state.sel.ville].map(ck=>{ const c=CITIES.find(x=>x.ck===ck); return `<button type="button" class="chip city-chip" data-g="ville" data-v="${esc(ck)}" aria-pressed="true" title="Retirer ${esc(c.label)}">${esc(c.label)} <span class="n"></span><span class="x" aria-hidden="true">×</span></button>`; }).join('');
}
syncViewBtns();
render();
if(location.hash.length>1) show(location.hash.slice(1));
</script>

</body>
